name: Deploy Backend (Cloud Run)

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-cloudrun.yml"

permissions:
  contents: read
  id-token: write

env:
  REGION: ${{ secrets.GCP_REGION }}
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  AR_REPO: ${{ secrets.GCP_ARTIFACT_REPO }} # e.g. learnpulse
  SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }} # e.g. learnpulse-backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth to Google Cloud (Workload Identity)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Build & Push Image (Cloud Build)
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/backend:${GITHUB_SHA}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          gcloud builds submit backend --tag "${IMAGE}"

      - name: Deploy to Cloud Run
        run: |
          SA_FLAG=""
          if [ -n "${{ secrets.CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT }}" ]; then
            SA_FLAG="--service-account ${{ secrets.CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT }}"
          fi
          gcloud run deploy "${SERVICE}" \
            --image "${IMAGE}" \
            --region "${REGION}" \
            --platform managed \
            --allow-unauthenticated \
            ${SA_FLAG} \
            --set-secrets "\
DATABASE_URL=DATABASE_URL:latest,\
DATABASE_SSL=DATABASE_SSL:latest,\
GEMINI_API_KEY=GEMINI_API_KEY:latest,\
GROQ_API_KEY=GROQ_API_KEY:latest,\
JWT_SECRET_KEY=JWT_SECRET_KEY:latest" \
            --set-env-vars "\
GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }},\
CORS_ORIGINS=[\"${{ secrets.CORS_ORIGIN }}\"]"
